<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Cursos</title>
</head>

<body class="bg-slate-900 min-h-screen p-4 sm:p-8 antialiased text-slate-300">
    <div class="max-w-6xl mx-auto">

        <div class="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h2 class="text-3xl font-bold text-white">Cursos</h2>
                <p class="text-slate-400">Gerencie o catálogo de disciplinas disponíveis</p>
            </div>

            <a sec:authorize="hasAnyRole('RECTOR', 'DIRECTOR', 'COORDINATOR')" th:href="@{/courses/create}"
                class="w-full sm:w-auto inline-flex items-center justify-center px-6 py-2.5 text-sm font-semibold text-white bg-emerald-600 hover:bg-emerald-500 rounded-lg transition-all shadow-lg shadow-emerald-900/20">
                + Novo Curso
            </a>
        </div>

        <div th:if="${not #lists.isEmpty(courses)}" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

            <div th:each="course : ${courses}"
                class="bg-slate-800 border border-slate-700 rounded-xl p-6 flex flex-col h-full hover:border-slate-500 transition-colors shadow-sm cursor-pointer">

                <div class="flex justify-between items-start mb-4">
                    <span
                        class="px-2.5 py-0.5 text-xs font-medium rounded-full bg-blue-900/40 text-blue-400 border border-blue-800/50"
                        th:text="${course.categoryName}">
                    </span>
                    <span
                        th:class="${course.active ? 'text-emerald-400' : 'text-rose-400'} + ' text-xs font-bold uppercase tracking-wider'"
                        th:text="${course.active ? '● Ativo' : '● Inativo'}">
                    </span>
                </div>

                <h3 class="text-xl font-bold text-white mb-2 truncate" th:text="${course.name}"></h3>

                <p class="text-slate-400 text-sm leading-relaxed mb-6 flex-grow break-words overflow-hidden"
                    style="display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;"
                    th:text="${course.description}">
                </p>

                <div sec:authorize="hasAnyRole('RECTOR', 'DIRECTOR', 'COORDINATOR')"
                    class="grid grid-cols-2 gap-3 pt-4 border-t border-slate-700 mt-auto">

                    <a th:href="@{/courses/editar/{id}(id=${course.id})}"
                        class="w-full text-center py-2 text-xs font-semibold bg-slate-700 hover:bg-slate-600 text-white rounded-md transition-colors flex items-center justify-center">
                        Editar
                    </a>

                    <form th:action="@{/courses/delete/{id}(id=${course.id})}" th:method="delete"
                        onsubmit="return confirm('Deseja excluir este curso?')" class="m-0">

                        <button type="submit"
                            class="w-full text-center py-2 text-xs font-semibold bg-rose-600/10 hover:bg-rose-600 text-rose-500 hover:text-white rounded-md transition-colors border border-rose-600/20 cursor-pointer">
                            Excluir
                        </button>
                    </form>

                    <form th:if="${!course.active}" th:action="@{/courses/{id}/active(id=${course.id})}"
                        th:method="patch" onsubmit="return confirm('Deseja ativar este curso?')" class="col-span-2 m-0">

                        <button type="submit"
                            class="w-full text-center py-2 text-xs font-semibold bg-green-600/10 hover:bg-green-600 text-green-500 hover:text-white rounded-md transition-colors border border-green-600/20 cursor-pointer">
                            ATIVAR
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(courses)}"
            class="text-center py-20 bg-slate-800 rounded-xl border border-dashed border-slate-700">
            <p class="text-slate-500 italic">Nenhum curso cadastrado.</p>
        </div>
    </div>
</body>

</html>
