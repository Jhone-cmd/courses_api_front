<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Meu Perfil - Courses API</title>
</head>

<body
    class="min-h-screen bg-slate-950 text-slate-100 antialiased flex flex-col justify-between overflow-x-hidden relative isolate">

    <div
        class="absolute inset-0 -z-10 bg-[radial-gradient(circle_at_top,_rgba(34,197,94,0.12),_transparent_40%),radial-gradient(circle_at_bottom,_rgba(56,189,248,0.08),_transparent_30%),linear-gradient(180deg,_#020617_0%,_#0f172a_100%)]">
    </div>

    <header class="w-full border-b border-white/5 bg-slate-950/75 backdrop-blur-xl sticky top-0 z-50">
        <div
            class="mx-auto max-w-7xl flex flex-col sm:flex-row items-center justify-between px-4 py-4 sm:px-6 lg:px-8 gap-4 sm:gap-0">

            <a th:href="@{/}" class="flex items-center gap-3">
                <div
                    class="flex h-11 w-11 items-center justify-center rounded-2xl bg-gradient-to-br from-emerald-400 to-cyan-500 text-slate-950 font-black shadow-lg shadow-emerald-500/20">
                    C
                </div>
                <div>
                    <p class="text-sm uppercase tracking-[0.3em] text-emerald-300/80">Courses API</p>
                </div>
            </a>

            <nav
                class="flex items-center gap-1 bg-slate-900/60 p-1.5 rounded-full border border-white/5 backdrop-blur-sm">
                <a th:href="@{/courses}"
                    class="px-4 py-2 rounded-full text-xs font-bold uppercase tracking-wider text-slate-400 hover:text-white transition-colors">
                    Cursos
                </a>
                <a th:if="${userLogged?.position != null and (
                        #strings.toUpperCase(userLogged.position) == 'RECTOR' or 
                        #strings.toUpperCase(userLogged.position) == 'REITOR' or 
                        #strings.toUpperCase(userLogged.position) == 'DIRECTOR' or 
                        #strings.toUpperCase(userLogged.position) == 'DIRETOR')}" th:href="@{/categories}"
                    class="px-4 py-2 rounded-full text-xs font-bold uppercase tracking-wider text-slate-400 hover:text-white transition-colors">
                    Categorias
                </a>
                <a th:href="@{/users/me}"
                    class="px-4 py-2 rounded-full text-xs font-bold uppercase tracking-wider bg-white/10 text-emerald-400 border border-emerald-500/10 shadow-sm">
                    Meu Perfil
                </a>
            </nav>

            <a th:href="@{/users/logout}"
                class="inline-flex items-center justify-center rounded-full border border-white/10 bg-white/5 px-4 py-2 text-xs font-semibold text-slate-300 transition hover:border-red-500/40 hover:bg-red-500/10 hover:text-red-400">
                Sair
            </a>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center px-4 py-12 relative">
        <div class="absolute -left-8 top-1/4 h-32 w-32 rounded-full bg-emerald-500/10 blur-3xl"></div>
        <div class="absolute -right-10 bottom-1/4 h-36 w-36 rounded-full bg-cyan-500/10 blur-3xl"></div>

        <div
            class="w-full max-w-4xl rounded-[2.5rem] border border-white/10 bg-slate-900/60 p-2 shadow-2xl shadow-emerald-950/20 backdrop-blur-md relative z-10">
            <div class="rounded-[2.2rem] bg-slate-950/40 p-6 sm:p-10 border border-white/5">

                <div class="flex items-center justify-between border-b border-white/5 pb-6 mb-8">
                    <div>
                        <p class="text-xs font-bold uppercase tracking-[0.25em] text-emerald-400">Área do Usuário</p>
                        <h2 class="text-2xl font-bold text-white mt-1">Meu Perfil</h2>
                    </div>
                    <span
                        class="rounded-full border border-emerald-500/20 bg-emerald-500/10 px-4 py-1.5 text-xs font-semibold text-emerald-300 ring-1 ring-emerald-500/20">
                        Sessão Ativa
                    </span>
                </div>

                <div class="flex flex-col md:flex-row items-center md:items-start gap-8">

                    <div class="flex-shrink-0">
                        <div
                            class="w-24 h-24 bg-gradient-to-br from-emerald-400 to-cyan-500 rounded-2xl flex items-center justify-center shadow-lg shadow-emerald-500/10 border border-white/10">
                            <span class="text-3xl font-black text-slate-950 tracking-wider"
                                th:text="${#strings.substring(userLogged.name, 0, 2).toUpperCase()}">
                                US
                            </span>
                        </div>
                    </div>

                    <div class="flex-grow w-full space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                            <div>
                                <label
                                    class="block text-xs font-bold uppercase tracking-[0.2em] text-slate-400 mb-2">Nome
                                    Completo</label>
                                <div class="px-4 py-3 bg-slate-950/60 border border-white/10 rounded-xl text-white font-medium break-all"
                                    th:text="${userLogged.name}">
                                </div>
                            </div>

                            <div>
                                <label
                                    class="block text-xs font-bold uppercase tracking-[0.2em] text-slate-400 mb-2">E-mail
                                    Corporativo</label>
                                <div class="px-4 py-3 bg-slate-950/60 border border-white/10 rounded-xl text-white font-medium break-all"
                                    th:text="${userLogged.email}">
                                </div>
                            </div>

                            <div>
                                <label
                                    class="block text-xs font-bold uppercase tracking-[0.2em] text-slate-400 mb-2">Cargo
                                    / Função</label>
                                <div class="px-4 py-3 bg-slate-950/60 border border-emerald-500/20 rounded-xl text-emerald-300 font-bold uppercase tracking-wider text-sm"
                                    th:text="${#strings.toUpperCase(userLogged.position)}">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-bold uppercase tracking-[0.2em] text-slate-400 mb-2">ID
                                    da Conta</label>
                                <div class="px-4 py-3 bg-slate-950/60 border border-white/10 rounded-xl text-slate-400 font-mono text-xs"
                                    th:text="${userLogged.id}">
                                </div>
                            </div>

                        </div>

                        <hr class="border-white/5 my-6">

                        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 pt-2">

                            <a th:if="${#strings.toUpperCase(userLogged.position) == 'RECTOR' or #strings.toUpperCase(userLogged.position) == 'REITOR'}"
                                th:href="@{/users/profiles}"
                                class="text-sm font-medium text-slate-400 hover:text-white transition-colors flex items-center gap-2 group">
                                <span class="transition-transform group-hover:-translate-x-1">←</span> Lista de Usuários
                            </a>

                            <div th:unless="${#strings.toUpperCase(userLogged.position) == 'RECTOR' or #strings.toUpperCase(userLogged.position) == 'REITOR'}"
                                class="hidden sm:block">
                            </div>

                            <div class="flex space-x-3 w-full sm:w-auto justify-end">
                                <a th:href="@{/users/editar/{id}(id=${userLogged.id})}"
                                    class="w-full sm:w-auto text-center px-6 py-3 text-sm font-bold text-slate-950 bg-white hover:bg-slate-200 rounded-full transition shadow-xl shadow-white/5 cursor-pointer">
                                    Editar Dados
                                </a>
                                <a th:href="@{/users/logout}"
                                    class="w-full sm:w-auto text-center px-6 py-3 text-sm font-semibold text-red-400 bg-red-500/10 border border-red-500/20 rounded-full transition hover:bg-red-500/20 cursor-pointer">
                                    Sair da Conta
                                </a>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="w-full py-4 text-center text-xs text-slate-600 border-t border-white/5">
        &copy; 2026 Courses API. Todos os direitos reservados.
    </footer>
</body>

</html>
