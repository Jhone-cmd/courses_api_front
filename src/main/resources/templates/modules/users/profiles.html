<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Perfil dos Usuários - Courses API</title>
</head>

<body
    class="min-h-screen bg-slate-950 text-slate-100 antialiased flex flex-col justify-between overflow-x-hidden relative isolate">

    <div
        class="absolute inset-0 -z-10 bg-[radial-gradient(circle_at_top,_rgba(34,197,94,0.12),_transparent_40%),radial-gradient(circle_at_bottom,_rgba(56,189,248,0.08),_transparent_30%),linear-gradient(180deg,_#020617_0%,_#0f172a_100%)]">
    </div>

    <header class="w-full border-b border-white/5 bg-slate-950/75 backdrop-blur-xl">
        <div class="mx-auto max-w-7xl flex items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
            <a th:href="@{/}" class="flex items-center gap-3">
                <div
                    class="flex h-11 w-11 items-center justify-center rounded-2xl bg-gradient-to-br from-emerald-400 to-cyan-500 text-slate-950 font-black shadow-lg shadow-emerald-500/20">
                    C
                </div>
                <div>
                    <p class="text-sm uppercase tracking-[0.3em] text-emerald-300/80">Courses API</p>
                </div>
            </a>

            <a th:href="@{/users/logout}"
                class="inline-flex items-center justify-center rounded-full border border-white/10 bg-white/5 px-4 py-2 text-xs font-semibold text-slate-300 transition hover:border-red-500/40 hover:bg-red-500/10 hover:text-red-400">
                Sair
            </a>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center px-4 py-12 relative">
        <div class="absolute -left-8 top-1/4 h-32 w-32 rounded-full bg-emerald-500/10 blur-3xl"></div>
        <div class="absolute -right-10 bottom-1/4 h-36 w-36 rounded-full bg-cyan-500/10 blur-3xl"></div>

        <div
            class="w-full max-w-5xl rounded-[2.5rem] border border-white/10 bg-slate-900/60 p-2 shadow-2xl shadow-emerald-950/20 backdrop-blur-md relative z-10">
            <div class="rounded-[2.2rem] bg-slate-950/40 p-4 sm:p-8 border border-white/5 overflow-hidden">

                <div
                    class="flex flex-col sm:flex-row gap-4 justify-between items-start sm:items-center border-b border-white/5 pb-6 mb-6">
                    <div>
                        <p class="text-xs font-bold uppercase tracking-[0.25em] text-emerald-400">Painel Administrativo
                        </p>
                        <h2 class="text-2xl font-bold text-white mt-1">Perfis de Usuários</h2>
                    </div>
                    <span
                        class="rounded-full border border-cyan-500/20 bg-cyan-500/10 px-4 py-1.5 text-xs font-semibold text-cyan-300 ring-1 ring-cyan-500/20">
                        Gerenciamento
                    </span>
                </div>

                <div class="w-full overflow-x-auto rounded-2xl border border-white/5 bg-slate-950/40">
                    <table class="w-full table-auto text-left border-collapse">
                        <thead class="hidden md:table-header-group">
                            <tr
                                class="border-b border-white/5 bg-white/[0.02] text-slate-400 uppercase text-xs tracking-wider">
                                <th class="px-6 py-4 font-bold text-slate-300">Nome</th>
                                <th class="px-6 py-4 font-bold text-slate-300">E-mail</th>
                                <th class="px-6 py-4 font-bold text-slate-300">Cargo</th>
                                <th class="px-6 py-4 font-bold text-slate-300 text-center w-36">Ações</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-white/5 text-sm block md:table-row-group">

                            <tr th:each="user : ${users}"
                                class="group hover:bg-white/[0.02] transition-colors block md:table-row p-4 border-b border-white/5 md:border-b-0 space-y-3 md:space-y-0">

                                <td
                                    class="flex justify-between items-center md:table-cell px-0 md:px-6 py-0 md:py-4 font-medium text-white whitespace-nowrap before:content-['Nome:'] before:text-slate-500 before:text-xs before:uppercase before:tracking-wider md:before:content-none">
                                    <span class="group-hover:text-emerald-300 transition-colors"
                                        th:text="${user.name}">Nome do Usuário</span>
                                </td>

                                <td
                                    class="flex justify-between items-center md:table-cell px-0 md:px-6 py-0 md:py-4 font-medium text-slate-300 whitespace-nowrap before:content-['E-mail:'] before:text-slate-500 before:text-xs before:uppercase before:tracking-wider md:before:content-none">
                                    <span th:text="${user.email}">email@exemplo.com</span>
                                </td>

                                <td
                                    class="flex justify-between items-center md:table-cell px-0 md:px-6 py-0 md:py-4 whitespace-nowrap before:content-['Cargo:'] before:text-slate-500 before:text-xs before:uppercase before:tracking-wider md:before:content-none">
                                    <span
                                        class="inline-flex rounded-lg bg-emerald-500/10 px-2.5 py-1 text-xs font-semibold text-emerald-300 ring-1 ring-emerald-500/20 uppercase tracking-wide"
                                        th:text="${user.position}">
                                        Cargo
                                    </span>
                                </td>

                                <td
                                    class="flex justify-between items-center md:table-cell px-0 md:px-6 py-1.5 md:py-4 whitespace-nowrap md:text-center before:content-['Ações:'] before:text-slate-500 before:text-xs before:uppercase before:tracking-wider md:before:content-none">
                                    <div class="flex justify-end md:justify-center items-center w-auto">
                                        <form th:action="@{/users/delete/{id}(id=${user.id})}" th:method="delete"
                                            onsubmit="return confirm('Tem certeza que deseja excluir este perfil?')"
                                            class="inline-block w-full md:w-auto m-0">

                                            <button type="submit"
                                                class="w-full md:w-auto px-4 py-2 text-xs font-semibold text-red-400 bg-red-500/10 border border-red-500/20 rounded-xl transition hover:bg-red-500/20 cursor-pointer">
                                                Deletar
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(users)}" class="block md:table-row">
                                <td colspan="4"
                                    class="px-6 py-12 text-center text-slate-500 italic block md:table-cell bg-slate-950/20">
                                    <div class="space-y-2">
                                        <p class="text-sm text-slate-400 font-medium">Nenhum usuário cadastrado no
                                            sistema</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="mt-6 pt-2">
                    <a th:href="@{/}"
                        class="text-sm font-medium text-slate-400 hover:text-white transition-colors flex items-center gap-2 group w-fit">
                        <span class="transition-transform group-hover:-translate-x-1">←</span> Voltar para o Início
                    </a>
                </div>

            </div>
        </div>
    </main>

    <footer class="w-full py-4 text-center text-xs text-slate-600 border-t border-white/5">
        &copy; 2026 Courses API. Todos os direitos reservados.
    </footer>
</body>

</html>
