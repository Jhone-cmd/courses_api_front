<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Perfil dos Usuários</title>
</head>

<body class="bg-slate-900 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 antialiased">

    <div class="w-full max-w-5xl bg-slate-800 rounded-xl shadow-xl overflow-hidden border border-slate-700">
        <div class="px-4 py-4 sm:px-6 bg-slate-850 border-b border-slate-700 flex justify-between items-center">
            <h2 class="text-lg sm:text-xl font-semibold text-white">Perfis de Usuários</h2>
            <span
                class="px-3 py-1 text-xs font-medium text-blue-400 bg-blue-900/30 rounded-full border border-blue-800/50">
                Gerenciamento
            </span>
        </div>

        <div class="w-full">
            <table class="w-full table-auto text-left border-collapse">
                <thead class="hidden md:table-header-group text-center">
                    <tr class="bg-slate-750 text-slate-400 uppercase text-xs tracking-wider border-b border-slate-700">
                        <th class="px-6 py-4 font-medium">Nome</th>
                        <th class="px-6 py-4 font-medium">E-mail</th>
                        <th class="px-6 py-4 font-medium">Cargo</th>
                        <th class="px-6 py-4 font-medium text-center w-40">Ações</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-700 text-center text-sm block md:table-row-group">

                    <tr th:each="user : ${users}"
                        class="hover:bg-slate-750/50 transition-colors block md:table-row p-4 sm:p-5 md:p-0 border-b border-slate-700 md:border-b-0 space-y-2.5 md:space-y-0">

                        <td
                            class="flex justify-between items-center md:table-cell px-0 md:px-6 py-0 md:py-4 font-medium text-white whitespace-nowrap before:content-['Nome:'] before:text-slate-500 before:font-medium md:before:content-none">
                            <span th:text="${user.name}"></span>
                        </td>

                        <td
                            class="flex justify-between items-center md:table-cell px-0 md:px-6 py-0 md:py-4 font-medium text-white whitespace-nowrap before:content-['E-mail:'] before:text-slate-500 before:font-medium md:before:content-none">
                            <span th:text="${user.email}"></span>
                        </td>

                        <td
                            class="flex justify-between items-center md:table-cell px-0 md:px-6 py-0 md:py-4 whitespace-nowrap before:content-['Cargo:'] before:text-slate-500 before:font-medium md:before:content-none">
                            <span class="px-2.5 py-1 text-xs font-medium bg-slate-700 text-slate-300 rounded"
                                th:text="${user.position}">
                            </span>
                        </td>
                        <td
                            class="flex justify-between items-center md:table-cell px-0 md:px-6 py-1.5 md:py-4 whitespace-nowrap md:text-center before:content-['Ações:'] before:text-slate-500 before:font-medium md:before:content-none">
                            <div class="flex justify-end md:justify-center items-center space-x-2 w-auto">

                                <a th:href="@{/users/editar/{id}(id=${user.id})}"
                                    class="px-3 py-1.5 text-xs font-medium text-white bg-blue-600 hover:bg-blue-500 rounded-md transition-colors shadow-sm cursor-pointer flex-1 md:flex-none text-center">
                                    Editar
                                </a>

                                <form th:action="@{/users/delete/{id}(id=${user.id})}" th:method="delete"
                                    onsubmit="return confirm('Tem certeza que deseja excluir este perfil?')"
                                    class="inline-block flex-1 md:flex-none m-0">

                                    <button type="submit"
                                        class="w-full px-3 py-1.5 text-xs font-medium text-white bg-red-600 hover:bg-red-500 rounded-md transition-colors shadow-sm cursor-pointer text-center">
                                        Deletar
                                    </button>
                                </form>

                            </div>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(users)}" class="block md:table-row">
                        <td colspan="5" class="px-6 py-10 text-center text-slate-500 italic block md:table-cell">
                            Nenhum usuário encontrado.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>

</html>
