<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:tiles="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Alteração de Senha - Courses API</title>
</head>

<body
    class="min-h-screen bg-slate-950 text-slate-100 antialiased flex flex-col justify-between overflow-x-hidden relative isolate">

    <div
        class="absolute inset-0 -z-10 bg-[radial-gradient(circle_at_top,_rgba(34,197,94,0.12),_transparent_40%),radial-gradient(circle_at_bottom,_rgba(56,189,248,0.08),_transparent_30%),linear-gradient(180deg,_#020617_0%,_#0f172a_100%)]">
    </div>

    <header class="w-full border-b border-white/5 bg-slate-950/75 backdrop-blur-xl">
        <div class="mx-auto max-w-7xl px-4 py-4 sm:px-6 lg:px-8">
            <a th:href="@{/}" class="flex items-center gap-3 w-fit">
                <div
                    class="flex h-11 w-11 items-center justify-center rounded-2xl bg-gradient-to-br from-emerald-400 to-cyan-500 text-slate-950 font-black shadow-lg shadow-emerald-500/20">
                    C
                </div>
                <div>
                    <p class="text-sm uppercase tracking-[0.3em] text-emerald-300/80">Courses API</p>
                </div>
            </a>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center px-4 py-12 relative">
        <div class="absolute -left-8 top-1/4 h-32 w-32 rounded-full bg-emerald-500/10 blur-3xl"></div>
        <div class="absolute -right-10 bottom-1/4 h-36 w-36 rounded-full bg-cyan-500/10 blur-3xl"></div>

        <form th:action="@{/users/change-password}" method="post" th:object="${user}" id="changePasswordForm"
            class="w-full max-w-md relative z-10">

            <div class="text-center mb-8">
                <h1 class="text-3xl font-black tracking-tight text-white sm:text-4xl">
                    Nova Senha
                </h1>
                <p class="mt-2 text-sm text-slate-400">
                    Redefina as credenciais de acesso da sua conta.
                </p>
            </div>

            <div
                class="space-y-5 rounded-[2.5rem] border border-white/10 bg-slate-900/60 p-6 sm:p-10 shadow-2xl shadow-emerald-950/20 backdrop-blur-md">

                <div>
                    <label
                        class="block text-xs font-bold uppercase tracking-[0.2em] text-slate-400 mb-1.5">E-mail</label>
                    <input type="text" name="email" required th:field="*{email}"
                        class="bg-slate-950/60 text-white placeholder-slate-500 text-sm rounded-xl w-full block p-4 focus:outline-none focus:ring-emerald-400 focus:ring-2 border border-white/10 transition-all"
                        placeholder="seu@email.com">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-[0.2em] text-slate-400 mb-1.5">Nova
                        Senha</label>
                    <input type="password" name="password" id="password" required th:field="*{password}"
                        class="bg-slate-950/60 text-white placeholder-slate-500 text-sm rounded-xl w-full block p-4 focus:outline-none focus:ring-emerald-400 focus:ring-2 border border-white/10 transition-all"
                        placeholder="••••••••">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-[0.2em] text-slate-400 mb-1.5">Confirmar
                        Nova Senha</label>
                    <input type="password" name="confirmPassword" id="confirmPassword" required
                        class="bg-slate-950/60 text-white placeholder-slate-500 text-sm rounded-xl w-full block p-4 focus:outline-none focus:ring-emerald-400 focus:ring-2 border border-white/10 transition-all"
                        placeholder="••••••••">
                </div>

                <div class="flex flex-col items-center justify-center space-y-2 w-full mx-auto">
                    <div class="w-full flex items-center justify-center rounded-xl bg-red-500/10 border border-red-500/20 py-3 px-4"
                        th:if="${error}">
                        <p class="text-red-400 font-medium text-sm text-center whitespace-normal break-words w-full"
                            th:text="${error}"></p>
                    </div>

                    <div id="password_error_container"
                        class="w-full flex items-center justify-center rounded-xl bg-red-500/10 border border-red-500/20 py-3 px-4"
                        style="display: none;">
                        <p class="text-red-400 font-medium text-sm text-center whitespace-normal break-words w-full"
                            id="password_error">
                            As senhas não conferem
                        </p>
                    </div>
                </div>

                <button type="submit"
                    class="w-full p-4 rounded-xl bg-gradient-to-r from-emerald-400 to-cyan-400 text-slate-950 font-bold tracking-wider hover:brightness-110 transition-all shadow-lg shadow-emerald-500/10">
                    ALTERAR SENHA
                </button>

                <div class="border-t border-white/5 mt-4 pt-4 text-center">
                    <a href="/users/login"
                        class="inline-block text-sm font-bold text-white hover:text-emerald-300 transition-colors underline underline-offset-4">
                        Voltar para o Login
                    </a>
                </div>
            </div>
        </form>
    </main>

    <footer class="w-full py-4 text-center text-xs text-slate-600 border-t border-white/5">
        &copy; 2026 Courses API. Todos os direitos reservados.
    </footer>
</body>

<script>
    document.getElementById("changePasswordForm").addEventListener("submit", (event) => {
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const errorContainer = document.getElementById("password_error_container");

        errorContainer.style.display = "none";

        if (password !== confirmPassword) {
            event.preventDefault();
            errorContainer.style.display = "flex";
        }
    });
</script>

</html>
